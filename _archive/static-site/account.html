<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Premium Pakistani Dresses</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .account-container { max-width: 500px; margin: 60px auto; padding: 0 20px; }
        .account-tabs { display: flex; gap: 0; margin-bottom: 40px; border-bottom: 2px solid var(--color-gray-200); }
        .account-tab { flex: 1; padding: 16px; text-align: center; font-weight: 600; font-size: 1rem; color: var(--color-gray-500); border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.3s ease; cursor: pointer; }
        .account-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
        .account-form { display: none; }
        .account-form.active { display: block; animation: fadeIn 0.4s ease; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; color: var(--color-secondary); }
        .form-group input { width: 100%; padding: 14px 16px; border: 2px solid var(--color-gray-300); border-radius: 10px; font-size: 0.95rem; transition: all 0.3s ease; }
        .form-group input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 4px rgba(139,105,20,0.1); }
        .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.9rem; }
        .form-options label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .form-options a { color: var(--color-primary); font-weight: 500; }
        .form-options a:hover { text-decoration: underline; }
        .social-login { margin-top: 32px; text-align: center; }
        .social-login p { color: var(--color-gray-500); font-size: 0.9rem; margin-bottom: 20px; position: relative; }
        .social-login p::before, .social-login p::after { content: ''; position: absolute; top: 50%; width: 30%; height: 1px; background: var(--color-gray-300); }
        .social-login p::before { left: 0; } .social-login p::after { right: 0; }
        .social-buttons { display: flex; gap: 12px; justify-content: center; }
        .social-btn { width: 50px; height: 50px; border: 2px solid var(--color-gray-300); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--color-gray-600); transition: all 0.3s ease; }
        .social-btn:hover { border-color: var(--color-primary); color: var(--color-primary); transform: translateY(-3px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body data-page="account.html">
    <div id="site-announcement"></div>
    <div id="site-header"></div>

    <main id="main">
        <div class="account-container">
            <div class="account-tabs">
                <div class="account-tab active" data-tab="login">Sign In</div>
                <div class="account-tab" data-tab="register">Create Account</div>
            </div>

            <form class="account-form active" id="loginForm">
                <div class="form-group"><label for="loginEmail">Email Address</label><input type="email" id="loginEmail" placeholder="Enter your email" required></div>
                <div class="form-group"><label for="loginPassword">Password</label><input type="password" id="loginPassword" placeholder="Enter your password" required></div>
                <div class="form-options">
                    <label><input type="checkbox" checked> Remember me</label>
                    <a href="#">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
                <div class="social-login">
                    <p>Or continue with</p>
                    <div class="social-buttons">
                        <button type="button" class="social-btn"><i class="fab fa-google"></i></button>
                        <button type="button" class="social-btn"><i class="fab fa-facebook-f"></i></button>
                        <button type="button" class="social-btn"><i class="fab fa-apple"></i></button>
                    </div>
                </div>
            </form>

            <form class="account-form" id="registerForm">
                <div class="form-group"><label for="regName">Full Name</label><input type="text" id="regName" placeholder="Enter your full name" required></div>
                <div class="form-group"><label for="regEmail">Email Address</label><input type="email" id="regEmail" placeholder="Enter your email" required></div>
                <div class="form-group"><label for="regPassword">Password</label><input type="password" id="regPassword" placeholder="Create a password" required></div>
                <div class="form-group"><label for="regConfirm">Confirm Password</label><input type="password" id="regConfirm" placeholder="Confirm your password" required></div>
                <div class="form-options"><label><input type="checkbox" required> I agree to the <a href="terms.html">Terms of Service</a></label></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
            </form>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.querySelectorAll('.account-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.account-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.account-form').forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
            });
        });
        document.getElementById('loginForm').addEventListener('submit', e => { e.preventDefault(); showToast('Signed in successfully!'); });
        document.getElementById('registerForm').addEventListener('submit', e => { e.preventDefault(); showToast('Account created successfully!'); });
    </script>
</body>
</html>
