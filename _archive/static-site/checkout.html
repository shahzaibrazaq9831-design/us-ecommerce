<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Premium Pakistani Dresses</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .checkout-layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; padding: 40px 0 80px; }
        .checkout-section { background: var(--color-white); border: 1px solid var(--color-gray-200); border-radius: 16px; padding: 28px; margin-bottom: 24px; }
        .checkout-section h2 { font-family: var(--font-heading); font-size: 1.3rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .checkout-section h2 span { width: 28px; height: 28px; background: var(--color-primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-family: var(--font-body); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .checkout-section .form-group { margin-bottom: 16px; }
        .checkout-section label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; }
        .checkout-section input, .checkout-section select { width: 100%; padding: 12px 14px; border: 2px solid var(--color-gray-300); border-radius: 8px; font-size: 0.9rem; }
        .checkout-section input:focus, .checkout-section select:focus { border-color: var(--color-primary); outline: none; }
        .order-summary { background: var(--color-cream); border-radius: 16px; padding: 28px; height: fit-content; position: sticky; top: 100px; }
        .order-summary h2 { font-family: var(--font-heading); font-size: 1.3rem; margin-bottom: 20px; }
        .summary-item { display: flex; gap: 14px; padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--color-gray-200); }
        .summary-item img { width: 60px; height: 80px; border-radius: 8px; object-fit: cover; }
        .summary-item .name { font-size: 0.9rem; font-weight: 600; }
        .summary-item .meta { font-size: 0.8rem; color: var(--color-gray-500); }
        .summary-item .item-price { margin-left: auto; font-weight: 600; }
        .summary-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 0.95rem; }
        .summary-row.total { border-top: 2px solid var(--color-gray-300); margin-top: 12px; padding-top: 16px; font-size: 1.15rem; font-weight: 700; }
        .secure-badge { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--color-gray-600); font-size: 0.8rem; margin-top: 16px; }
        @media (max-width: 900px) { .checkout-layout { grid-template-columns: 1fr; } .order-summary { position: static; } .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body data-page="checkout.html">
    <div id="site-announcement"></div>
    <div id="site-header"></div>

    <main id="main">
        <div class="container">
            <h1 style="font-family: var(--font-heading); font-size: 2rem; padding: 30px 0;">Checkout</h1>
            <div class="checkout-layout">
                <div>
                    <div class="checkout-section">
                        <h2><span>1</span> Contact Information</h2>
                        <div class="form-row">
                            <div class="form-group"><label>Email</label><input type="email" placeholder="you@example.com" required></div>
                            <div class="form-group"><label>Phone</label><input type="tel" placeholder="+1 234 567 8900" required></div>
                        </div>
                    </div>
                    <div class="checkout-section">
                        <h2><span>2</span> Shipping Address</h2>
                        <div class="form-group"><label>Full Name</label><input type="text" placeholder="Full name" required></div>
                        <div class="form-group"><label>Address</label><input type="text" placeholder="Street address" required></div>
                        <div class="form-row">
                            <div class="form-group"><label>City</label><input type="text" placeholder="City" required></div>
                            <div class="form-group"><label>Postal Code</label><input type="text" placeholder="Postal code"></div>
                        </div>
                        <div class="form-group"><label>Country</label>
                            <select><option>United States</option><option>United Kingdom</option><option>Canada</option><option>Australia</option><option>Pakistan</option><option>Other</option></select>
                        </div>
                    </div>
                    <div class="checkout-section">
                        <h2><span>3</span> Payment Method</h2>
                        <div class="form-group"><label>Card Number</label><input type="text" placeholder="1234 5678 9012 3456"></div>
                        <div class="form-row">
                            <div class="form-group"><label>Expiry</label><input type="text" placeholder="MM / YY"></div>
                            <div class="form-group"><label>CVC</label><input type="text" placeholder="CVC"></div>
                        </div>
                        <div class="secure-badge"><i class="fas fa-lock"></i> Payments are encrypted and secure</div>
                    </div>
                </div>

                <div class="order-summary">
                    <h2>Order Summary</h2>
                    <div id="summaryItems"></div>
                    <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">$0.00</span></div>
                    <div class="summary-row"><span>Shipping</span><span style="color: var(--color-success);">Free</span></div>
                    <div class="summary-row total"><span>Total</span><span id="sumTotal">$0.00</span></div>
                    <button class="btn btn-primary" style="width: 100%; margin-top: 20px;" onclick="placeOrder()">Place Order</button>
                    <div class="secure-badge"><i class="fab fa-cc-stripe"></i> Secure checkout powered by Stripe</div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cartItems = JSON.parse(localStorage.getItem('ppd_cart')) || [];
            const itemsEl = $('#summaryItems');
            if (itemsEl) {
                itemsEl.innerHTML = cartItems.length ? cartItems.map(i => `
                    <div class="summary-item">
                        <img src="${i.image}" alt="${i.name}">
                        <div><div class="name">${i.name}</div><div class="meta">Qty: ${i.quantity}</div></div>
                        <div class="item-price">$${(i.price * i.quantity).toFixed(2)}</div>
                    </div>`).join('') : '<p style="color: var(--color-gray-500);">Your cart is empty.</p>';
            }
            const total = cartItems.reduce((s, i) => s + i.price * i.quantity, 0);
            $('#sumSubtotal').textContent = `$${total.toFixed(2)}`;
            $('#sumTotal').textContent = `$${total.toFixed(2)}`;
        });
        function placeOrder() {
            showToast('Order placed successfully! (demo)');
            localStorage.removeItem('ppd_cart');
        }
    </script>
</body>
</html>
