<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Premium Pakistani Dresses</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .wishlist-container { padding: 40px 0 80px; }
        .wishlist-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        .empty-wishlist { text-align: center; padding: 80px 20px; }
        .empty-wishlist i { font-size: 4rem; color: var(--color-gray-300); margin-bottom: 24px; }
        .empty-wishlist h2 { font-family: var(--font-heading); font-size: 1.75rem; margin-bottom: 12px; }
        .empty-wishlist p { color: var(--color-gray-600); margin-bottom: 32px; }
        @media (max-width: 1024px) { .wishlist-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .wishlist-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body data-page="wishlist.html">
    <div id="site-announcement"></div>
    <div id="site-header"></div>

    <main id="main">
        <div class="container">
            <h1 style="font-family: var(--font-heading); font-size: 2rem; padding: 30px 0;">My Wishlist</h1>
            <div class="wishlist-container" id="wishlistContainer"></div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
