<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections - Premium Pakistani Dresses</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .collections-hero { text-align: center; padding: 80px 20px 60px; background: var(--color-cream); }
        .collections-hero h1 { font-family: var(--font-heading); font-size: 2.5rem; margin-bottom: 16px; }
        .collections-hero p { color: var(--color-gray-600); max-width: 600px; margin: 0 auto; font-size: 1.05rem; }
        .collections-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; padding: 60px 0 100px; }
        .collection-card { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 16/10; box-shadow: var(--shadow-md); transition: all 0.4s ease; }
        .collection-card:hover { transform: translateY(-10px); box-shadow: var(--shadow-xl); }
        .collection-image { width: 100%; height: 100%; background-size: cover; background-position: center; transition: transform 0.6s ease; }
        .collection-card:hover .collection-image { transform: scale(1.08); }
        .collection-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.1) 60%); display: flex; flex-direction: column; justify-content: flex-end; padding: 40px; color: white; }
        .collection-overlay h2 { font-family: var(--font-heading); font-size: 2rem; margin-bottom: 8px; }
        .collection-overlay p { font-size: 0.95rem; opacity: 0.9; margin-bottom: 20px; }
        .collection-overlay .btn { align-self: flex-start; background: white; color: var(--color-secondary); }
        .collection-overlay .btn:hover { background: var(--color-primary); color: white; }
        @media (max-width: 768px) { .collections-grid { grid-template-columns: 1fr; } .collection-overlay h2 { font-size: 1.5rem; } }
    </style>
</head>
<body data-page="collections.html">
    <div id="site-announcement"></div>
    <div id="site-header"></div>

    <main id="main">
        <div class="collections-hero">
            <div class="container">
                <h1>Shop by Occasion</h1>
                <p>Find your look for the ceremony, the celebration and every gathering in between. Curated collections for every moment that matters.</p>
            </div>
        </div>

        <div class="container">
            <div class="collections-grid" id="collectionsGrid"></div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const occasions = window.SITE_OCCASIONS || [];
            const descriptions = {
                Barat: "Regal ensembles for the groom's wedding day",
                Mehndi: "Vibrant and festive looks for the mehndi night",
                Nikkah: "Elegant and graceful attire for your nikkah",
                Walima: "Stunning reception looks for the newlyweds",
                Mayun: "Soft pastels and traditional mayun outfits",
                Dholki: "Fun and festive outfits for musical nights",
                Engagement: "Romantic looks to celebrate your engagement",
                Eid: "Joyful festive wear for Eid celebrations"
            };
            $('#collectionsGrid').innerHTML = occasions.map(o => `
                <a href="shop.html" class="collection-card">
                    <div class="collection-image" style="background-image: url('${o.image}');"></div>
                    <div class="collection-overlay">
                        <h2>${o.name}</h2>
                        <p>${descriptions[o.name] || 'Beautiful curated collection'}</p>
                        <span class="btn">Shop Collection</span>
                    </div>
                </a>`).join('');
        });
    </script>
</body>
</html>
