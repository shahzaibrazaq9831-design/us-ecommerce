<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Premium Pakistani Dresses</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .page-hero { background: var(--color-cream); text-align: center; padding: 70px 20px; border-bottom: 1px solid var(--color-gray-200); }
        .page-hero h1 { font-family: var(--font-heading); font-size: 2.5rem; margin-bottom: 12px; }
        .page-hero p { color: var(--color-gray-600); }
        .contact-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 60px; padding: 60px 0 100px; }
        .contact-info-item { display: flex; gap: 16px; margin-bottom: 32px; }
        .contact-info-item .icon { width: 50px; height: 50px; min-width: 50px; background: var(--color-primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.1rem; }
        .contact-info-item h4 { font-size: 1rem; margin-bottom: 4px; }
        .contact-info-item p { color: var(--color-gray-600); font-size: 0.95rem; }
        .contact-form .form-group { margin-bottom: 24px; }
        .contact-form label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; }
        .contact-form input, .contact-form textarea, .contact-form select { width: 100%; padding: 14px 16px; border: 2px solid var(--color-gray-300); border-radius: 10px; font-size: 0.95rem; transition: all 0.3s ease; font-family: inherit; }
        .contact-form input:focus, .contact-form textarea:focus { border-color: var(--color-primary); }
        .contact-form textarea { min-height: 140px; resize: vertical; }
        @media (max-width: 900px) { .contact-layout { grid-template-columns: 1fr; gap: 40px; } }
    </style>
</head>
<body data-page="contact.html">
    <div id="site-announcement"></div>
    <div id="site-header"></div>

    <main>
        <div class="page-hero">
            <h1>Contact Us</h1>
            <p>We're here to help with sizing, styling and orders</p>
        </div>

        <div class="container">
            <div class="contact-layout">
                <div>
                    <h2 style="font-family: var(--font-heading); font-size: 1.5rem; margin-bottom: 32px;">Get in Touch</h2>
                    <div class="contact-info-item">
                        <div class="icon"><i class="fas fa-envelope"></i></div>
                        <div><h4>Email</h4><p>support@premiumpakistanidresses.com</p></div>
                    </div>
                    <div class="contact-info-item">
                        <div class="icon"><i class="fas fa-phone-alt"></i></div>
                        <div><h4>Phone / WhatsApp</h4><p>+92 320 0909666</p></div>
                    </div>
                    <div class="contact-info-item">
                        <div class="icon"><i class="fas fa-building"></i></div>
                        <div><h4>Company</h4><p>PPD GLOBAL LLC</p></div>
                    </div>
                    <div class="contact-info-item">
                        <div class="icon"><i class="fas fa-clock"></i></div>
                        <div><h4>Support Hours</h4><p>Mon – Sat, 9am – 9pm (PKT)</p></div>
                    </div>
                    <a href="https://wa.me/923200909666" target="_blank" class="btn btn-primary" style="margin-top: 16px;"><i class="fab fa-whatsapp"></i> Chat on WhatsApp</a>
                </div>

                <form class="contact-form" id="contactForm">
                    <h2 style="font-family: var(--font-heading); font-size: 1.5rem; margin-bottom: 24px;">Send a Message</h2>
                    <div class="form-group"><label>Full Name</label><input type="text" placeholder="Your name" required></div>
                    <div class="form-group"><label>Email Address</label><input type="email" placeholder="you@example.com" required></div>
                    <div class="form-group"><label>Subject</label>
                        <select><option>General Inquiry</option><option>Order Support</option><option>Sizing Help</option><option>Returns & Refunds</option><option>Custom Stitching</option></select>
                    </div>
                    <div class="form-group"><label>Message</label><textarea placeholder="How can we help you?" required></textarea></div>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', e => {
            e.preventDefault();
            showToast('Message sent! We will get back to you soon.');
            e.target.reset();
        });
    </script>
</body>
</html>
